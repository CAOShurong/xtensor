name: Shape benchmark comparison
on:
  push:
    branches: [diagnostics/pr2939-shape-7697]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compare exact base and head on one runner
        env:
          CC: gcc-13
          CXX: g++-13
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          CODSPEED_PROFILER_ENABLED: "false"
        run: python3 diagnostics/shape_comparison.py
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shape-comparison
          path: shape-evidence
          retention-days: 30
          if-no-files-found: error
